    <style>
      /* Custom Scrollbar for that technical feel */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #a1a1aa; /* zinc-400 */
        border: 1px solid transparent;
        background-clip: content-box;
        border-radius: 4px;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: #27272a; /* zinc-800 */
        border: 1px solid #09090b;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #71717a;
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: #3f3f46;
      }

      .grid-background {
        background-image:
          linear-gradient(to right, #e4e4e7 1px, transparent 1px),
          linear-gradient(to bottom, #e4e4e7 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
      }

      .dark .grid-background {
        background-image:
          linear-gradient(to right, #27272a 1px, transparent 1px),
          linear-gradient(to bottom, #27272a 1px, transparent 1px);
      }
    </style>
    <link rel="stylesheet" href="/index.css" />
    
    <!-- Prevent flash of unstyled content by applying theme before React loads -->
    <script>
      (function() {
        const storageKey = 'vite-ui-theme';
        const theme = localStorage.getItem(storageKey) || 'system';
        const root = document.documentElement;
        
        if (theme === 'system') {
          const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          root.classList.add(systemTheme);
        } else {
          root.classList.add(theme);
        }
      })();
    </script>
  </head>
  <body
    class="bg-slate-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-200 transition-colors duration-300"
  >
    <div id="root"></div>

  </body>
