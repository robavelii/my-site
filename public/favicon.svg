<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="45" fill="#18181b" stroke="url(#grad)" stroke-width="4" />
  
  <!-- Animated Inner Ring -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="url(#grad)" stroke-width="2" stroke-dasharray="20 10">
    <animateTransform 
      attributeName="transform" 
      attributeType="XML" 
      type="rotate" 
      from="0 50 50" 
      to="360 50 50" 
      dur="10s" 
      repeatCount="indefinite" />
  </circle>
  
  <!-- Initials -->
  <text x="50" y="65" font-family="monospace" font-size="40" font-weight="bold" fill="url(#grad)" text-anchor="middle">RF</text>
</svg>
